<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QS SMART AI - quantify team</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root { --blue-primary: #004AAD; --bg-main: #f4f7fa; }
    body { background: var(--bg-main); color: #1e293b; font-family: system-ui, -apple-system, sans-serif; }
    .card { background: white; border: 1px solid #d4e3f0; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0, 74, 173, 0.04); }
    .tab { padding: 12px 18px; border-bottom: 3px solid transparent; font-weight: 600; font-size: 14px; color: #64748b; cursor: pointer; }
    .tab.active { border-color: var(--blue-primary); color: var(--blue-primary); background: #CBE6F7; }
    .section { display: none; }
    .section.active { display: block; }
    .btn { padding: 8px 14px; border-radius: 8px; background: var(--blue-primary); color: white; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; border: none; }
    .btn:hover { background: #00337a; }
    .btn.secondary { background: #fff; color: var(--blue-primary); border: 1px solid var(--blue-primary); }
    .btn.secondary:hover { background: #CBE6F7; }
    .btn.hero { background: var(--blue-primary); font-size: 13px; padding: 10px 18px; box-shadow: 0 4px 12px rgba(0, 74, 173, 0.25); }
    .input { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; outline: none; }
    .input:focus { border-color: var(--blue-primary); }
    .source { border-left: 3px solid var(--blue-primary); padding: 8px 12px; margin: 8px 0; background: #f0f7ff; font-size: 12px; }
    mark.hl-query { background-color: #fbcfe8; color: #9d174d; font-weight: 700; padding: 1px 4px; border-radius: 4px; }
    mark.hl-date { background-color: #CBE6F7; color: #004AAD; font-weight: 700; padding: 1px 4px; border-radius: 4px; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: white; border-radius: 12px; width: 100%; max-width: 500px; padding: 24px; }
  </style>
</head>
<body>

<header class="bg-white border-b sticky top-0 z-30 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 cursor-pointer" onclick="goHome()">
      <div class="bg-[#004AAD] text-white font-black px-3 py-1.5 rounded-lg text-lg tracking-wider">QS</div>
      <div>
        <h1 class="text-xl font-extrabold text-[#004AAD]">QS SMART AI</h1>
        <p class="text-xs text-slate-500">by quantify team</p>
      </div>
    </div>
    <div class="flex gap-2">
      <button class="btn secondary" onclick="openSettings()">⚙️ API Settings</button>
    </div>
  </div>
  <!-- Main Nav Tabs (Only show in project view) -->
  <nav id="mainNav" class="max-w-7xl mx-auto px-4 flex overflow-x-auto border-t border-slate-100 hidden">
    <button class="tab active" data-tab="upload">1. File Upload & Extraction</button>
    <button class="tab" data-tab="results">2. AI Audit Dashboard</button>
    <button class="tab" data-tab="search">3. Keyterm Search</button>
    <button class="tab" data-tab="deadline-calc">4. Cap. 652 Timeline Calculator</button>
  </nav>
</header>

<main class="max-w-7xl mx-auto p-4 pt-6" id="appContainer">
  <!-- Dynamic Content Rendered Here -->
</main>

<div id="modalContainer"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

// ==========================================
// 1. 状态管理与持久化 (多项目支持)
// ==========================================
let state = {
  view: 'home', // 'home' or 'project'
  projects: JSON.parse(localStorage.getItem('qs_projects')) || [
    { id: 'p1', name: 'Zung Fu Retail Project', contract: 'Enabling Works', ref: 'W/114105' }
  ],
  currentProject: null,
  file: null,
  extractedText: '',
  aiData: null, // 存放 AI 返回的 JSON 结构化数据
  isAnalyzing: false
};

function saveProjects() { localStorage.setItem('qs_projects', JSON.stringify(state.projects)); }
function loadCfg() { try { return JSON.parse(localStorage.getItem('qs_cfg') || '{}'); } catch { return {}; } }
const $ = id => document.getElementById(id);

// ==========================================
// 2. 路由渲染
// ==========================================
function render() {
  const nav = $('mainNav');
  if (state.view === 'home') {
    nav.classList.add('hidden');
    renderHome();
  } else {
    nav.classList.remove('hidden');
    renderProject();
  }
}

function goHome() { state.view = 'home'; state.currentProject = null; state.aiData = null; render(); }

function openProject(id) {
  state.currentProject = state.projects.find(p => p.id === id);
  state.view = 'project';
  state.file = null;
  state.aiData = null;
  state.extractedText = '';
  switchTab('upload');
  render();
}

// --- Homepage (项目列表) ---
function renderHome() {
  const cards = state.projects.map(p => `
    <div class="card cursor-pointer hover:border-[#004AAD] transition" onclick="openProject('${p.id}')">
      <h3 class="font-bold text-lg text-slate-800">${p.name}</h3>
      <p class="text-xs text-slate-500 mt-1">${p.contract || 'No contract info'}</p>
      <p class="text-xs text-[#004AAD] font-mono mt-2">${p.ref || ''}</p>
    </div>
  `).join('');

  $('appContainer').innerHTML = `
    <div class="mb-6">
      <h2 class="text-2xl font-bold text-slate-900">Projects</h2>
      <p class="text-sm text-slate-500">Select a project to upload documents and extract key information.</p>
    </div>
    <div class="grid md:grid-cols-3 gap-4">
      ${cards}
      <div class="card border-dashed border-2 flex flex-col items-center justify-center cursor-pointer hover:bg-slate-50 text-slate-500" onclick="openNewProjectModal()">
        <span class="text-3xl mb-2">+</span>
        <span class="font-bold text-sm">New project</span>
      </div>
    </div>
  `;
}

// --- Project View (Tabs) ---
function renderProject() {
  const p = state.currentProject;
  $('appContainer').innerHTML = `
    <div class="mb-6 flex justify-between items-end">
      <div>
        <button class="text-xs text-slate-500 hover:text-[#004AAD] mb-2 font-bold" onclick="goHome()">← Back to Projects</button>
        <h2 class="text-2xl font-bold text-slate-900">${p.name}</h2>
        <p class="text-sm text-slate-500">${p.contract || ''} ${p.ref ? '· ' + p.ref : ''}</p>
      </div>
    </div>

    <!-- TAB 1: Upload -->
    <section id="upload" class="section active">
      <div class="grid lg:grid-cols-2 gap-6">
        <div class="card border-2 border-dashed border-[#004AAD] text-center py-10 cursor-pointer" onclick="$('fileInput').click()">
          <div class="text-4xl mb-2">📄</div>
          <b class="text-sm text-slate-800">Click to upload or drag PDF here</b>
          <p class="text-xs text-slate-500 mt-1">Extract text locally, then send to AI for rigid JSON parsing.</p>
          <input type="file" id="fileInput" class="hidden" accept=".pdf" onchange="handleFile(this.files[0])">
        </div>
        <div class="card bg-[#004AAD] text-white space-y-3 flex flex-col justify-center">
          <b class="text-xs uppercase tracking-wider text-[#CBE6F7]">Analysis Control</b>
          <p class="text-xs text-slate-200">Run the AI analysis to populate the Dashboard, Search, and Timeline tabs.</p>
          <div id="fileNameDisplay" class="text-sm font-bold truncate">No file selected</div>
          <button id="btnAnalyze" class="btn bg-white text-[#004AAD] hover:bg-[#CBE6F7] w-full" onclick="runAIAnalysis()" disabled>Run AI Analysis</button>
          <div id="progressLog" class="text-xs mt-2 text-[#CBE6F7]"></div>
        </div>
      </div>
    </section>

    <!-- TAB 2: Dashboard -->
    <section id="results" class="section">
      <div id="dashboardContent" class="text-center text-slate-500 py-10">
        No data. Please upload a file and run AI analysis first.
      </div>
    </section>

    <!-- TAB 3: Search -->
    <section id="search" class="section">
      <div class="card space-y-4">
        <div class="flex gap-2">
          <input id="query" class="input" placeholder="Search terms (e.g., Clause, HK$, 2026)">
          <button class="btn" onclick="runSearch()">Filter & Highlight</button>
        </div>
        <div id="searchResults" class="text-xs space-y-2"></div>
      </div>
    </section>

    <!-- TAB 4: Timeline Calculator -->
    <section id="deadline-calc" class="section">
      <div class="grid lg:grid-cols-3 gap-6">
        <div class="card space-y-3">
          <h3 class="font-bold text-sm border-b pb-2">Inputs (Auto-filled by AI if available)</h3>
          <label class="block text-xs font-bold text-slate-700">Claim Notice Date
            <input id="calcDate" type="date" class="input mt-1">
          </label>
          <label class="block text-xs font-bold text-slate-700">Response Period (Days)
            <select id="calcDays" class="input mt-1">
              <option value="30">30 Days (Cap. 652 Default)</option>
              <option value="14">14 Days</option>
            </select>
          </label>
          <button class="btn w-full" onclick="runCalculator()">Generate Timeline</button>
        </div>
        <div class="card lg:col-span-2">
          <h3 class="font-bold text-sm border-b pb-2 mb-4">Cap. 652 Statutory Timeline</h3>
          <div id="timelineOutput" class="text-xs text-slate-500">Awaiting calculation...</div>
        </div>
      </div>
    </section>
  `;

  // Bind Tab logic
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
}

function switchTab(tabId) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === tabId));
}

// ==========================================
// 3. 核心逻辑：PDF 提取与 AI 解析
// ==========================================
function handleFile(file) {
  if (!file) return;
  if (!file.name.toLowerCase().endsWith('.pdf')) return alert('Only PDF supported.');
  state.file = file;
  $('fileNameDisplay').innerText = file.name;
  $('btnAnalyze').disabled = false;
  $('progressLog').innerText = 'File ready.';
}

async function runAIAnalysis() {
  if (!state.file || state.isAnalyzing) return;
  const cfg = loadCfg();
  if (!cfg.endpoint || !cfg.apiKey || !cfg.model) return alert('Please configure API Settings first.');

  state.isAnalyzing = true;
  const btn = $('btnAnalyze');
  btn.disabled = true;
  btn.innerText = 'Processing...';
  
  try {
    // 1. 提取文本
    $('progressLog').innerText = 'Step 1: Extracting text from PDF...';
    const arrayBuffer = await state.file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let fullText = "";
    // 限制页数防止 Token 爆炸
    const maxPages = Math.min(pdf.numPages, 15); 
    for (let i = 1; i <= maxPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      fullText += content.items.map(item => item.str).join(" ") + "\n";
    }
    state.extractedText = fullText;
    if (!fullText.trim()) throw new Error("PDF is empty or scanned image.");

    // 2. 构建极其严苛的 AI Prompt
    $('progressLog').innerText = 'Step 2: AI is extracting structured data...';
    
    const systemPrompt = `You are an expert Quantity Surveyor and Legal Auditor under Hong Kong law.
Analyze the provided document text and extract specific information.
You MUST respond with a valid JSON object ONLY, formatted exactly as follows:
{
  "clauses": [{"ref": "Clause Number", "title": "Short Title", "relevance": "Why it matters"}],
  "dates": [{"date": "YYYY-MM-DD", "event": "Description of event (e.g., Claim Notice served)"}],
  "amounts": [{"value": "HK$ 1,000", "desc": "What this amount is for"}],
  "risks": ["Risk 1", "Risk 2"],
  "summary": "A 2-sentence executive summary of the document."
}
Do not include markdown blocks like \`\`\`json. Output raw JSON.`;

    let url = cfg.endpoint.replace(/\/$/, '');
    if (!url.endsWith('/chat/completions')) url = url.endsWith('/v1') ? url + '/chat/completions' : url + '/v1/chat/completions';

    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
      body: JSON.stringify({
        model: cfg.model,
        messages: [
          { role: "system", content: systemPrompt },
          { role: "user", content: "Here is the document text:\n\n" + fullText }
        ],
        temperature: 0.1 // 保持极低温度，确保格式稳定
      })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error?.message || "API Error");

    // 3. 解析 JSON 填补空白
    let rawContent = data.choices[0].message.content;
    // 容错处理：如果 AI 还是带了 markdown 符号，强行剥离
    rawContent = rawContent.replace(/```json/g, '').replace(/```/g, '').trim();
    
    state.aiData = JSON.parse(rawContent);
    
    // 4. 更新 UI
    renderDashboard();
    autoFillTimeline();
    switchTab('results');
    $('progressLog').innerText = 'Analysis Complete!';

  } catch (error) {
    console.error(error);
    $('progressLog').innerText = 'Error: ' + error.message;
    alert('Analysis failed: ' + error.message);
  } finally {
    state.isAnalyzing = false;
    btn.disabled = false;
    btn.innerText = 'Re-run AI Analysis';
  }
}

// ==========================================
// 4. 渲染看板与填充数据
// ==========================================
function renderDashboard() {
  const d = state.aiData;
  if (!d) return;

  const clauseHtml = d.clauses.map(c => `
    <div class="p-3 border-l-4 border-[#004AAD] bg-slate-50 mb-2">
      <b class="text-[#004AAD]">${c.ref}</b> - <span class="font-bold">${c.title}</span>
      <p class="text-slate-600 mt-1">${c.relevance}</p>
    </div>
  `).join('');

  const dateHtml = d.dates.map(dt => `
    <div class="flex justify-between py-1 border-b border-slate-100">
      <span class="font-mono text-[#004AAD] font-bold">${dt.date}</span>
      <span class="text-slate-600 text-right">${dt.event}</span>
    </div>
  `).join('');

  const amountHtml = d.amounts.map(a => `
    <span class="inline-block bg-emerald-100 text-emerald-800 font-bold px-2 py-1 rounded mr-2 mb-2">${a.value} <span class="font-normal text-xs">(${a.desc})</span></span>
  `).join('');

  const riskHtml = d.risks.map(r => `
    <li class="text-red-700 ml-4 list-disc">${r}</li>
  `).join('');

  $('dashboardContent').innerHTML = `
    <div class="grid md:grid-cols-2 gap-6">
      <!-- Left: Executive Summary -->
      <div class="space-y-6">
        <div class="card bg-[#004AAD] text-white">
          <h3 class="text-xs uppercase text-[#CBE6F7] font-bold mb-2">AI Executive Summary</h3>
          <p class="text-sm leading-relaxed">${d.summary}</p>
        </div>
        <div class="card">
          <h3 class="font-bold text-sm border-b pb-2 mb-3 text-slate-800">Extracted Amounts</h3>
          <div>${amountHtml || '<span class="text-slate-400 text-xs">None found</span>'}</div>
        </div>
        <div class="card">
          <h3 class="font-bold text-sm border-b pb-2 mb-3 text-slate-800">Risk Flags</h3>
          <ul class="space-y-2">${riskHtml || '<li class="text-slate-400 text-xs">None found</li>'}</ul>
        </div>
      </div>

      <!-- Right: Clauses & Dates -->
      <div class="space-y-6">
        <div class="card">
          <h3 class="font-bold text-sm border-b pb-2 mb-3 text-slate-800">Key Clauses</h3>
          ${clauseHtml || '<span class="text-slate-400 text-xs">None found</span>'}
        </div>
        <div class="card">
          <h3 class="font-bold text-sm border-b pb-2 mb-3 text-slate-800">Timeline Events</h3>
          ${dateHtml || '<span class="text-slate-400 text-xs">None found</span>'}
        </div>
      </div>
    </div>
  `;
}

// 自动填充计算器
function autoFillTimeline() {
  const d = state.aiData;
  if (d && d.dates && d.dates.length > 0) {
    // 找最早的日期作为通知日期
    const sortedDates = d.dates.map(x => x.date).sort();
    const earliest = sortedDates[0];
    if (earliest) {
      $('calcDate').value = earliest;
      runCalculator();
    }
  }
}

function runCalculator() {
  const dateVal = $('calcDate').value;
  if (!dateVal) return;
  const days = parseInt($('calcDays').value);
  
  const start = new Date(dateVal);
  const deadline = new Date(start);
  deadline.setDate(deadline.getDate() + days);
  
  const today = new Date();
  const diffTime = deadline - today;
  const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

  const isOverdue = diffDays < 0;
  const colorClass = isOverdue ? 'text-red-600' : 'text-emerald-600';

  $('timelineOutput').innerHTML = `
    <div class="space-y-6">
      <div class="p-4 rounded-lg border ${isOverdue ? 'bg-red-50 border-red-200' : 'bg-emerald-50 border-emerald-200'}">
        <div class="text-sm font-bold ${colorClass}">
          ${isOverdue ? '❌ RESPONSE OVERDUE' : '✔ ' + diffDays + ' DAYS REMAINING'}
        </div>
        <p class="text-xs text-slate-600 mt-1">
          Statutory Deadline: <b>${deadline.toISOString().split('T')[0]}</b>
        </p>
      </div>

      <div class="relative border-l-2 border-[#004AAD] ml-3 pl-6 space-y-8">
        <!-- Event 1 -->
        <div class="relative">
          <div class="absolute -left-[31px] top-0 bg-[#004AAD] text-white w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold">1</div>
          <b class="text-slate-800 text-sm block">Payment Claim Received</b>
          <span class="text-[#004AAD] font-mono text-xs font-bold">${start.toISOString().split('T')[0]}</span>
        </div>
        
        <!-- Event 2 -->
        <div class="relative">
          <div class="absolute -left-[31px] top-0 ${isOverdue ? 'bg-red-500' : 'bg-amber-500'} text-white w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold">2</div>
          <b class="text-slate-800 text-sm block">Payment Response Deadline</b>
          <span class="text-amber-600 font-mono text-xs font-bold">${deadline.toISOString().split('T')[0]}</span>
        </div>

        <!-- Event 3 -->
        <div class="relative">
          <div class="absolute -left-[31px] top-0 bg-slate-400 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold">3</div>
          <b class="text-slate-800 text-sm block">Adjudication Window Opens</b>
          <span class="text-slate-500 font-mono text-xs">${deadline.toISOString().split('T')[0]} onward</span>
        </div>
      </div>
    </div>
  `;
}

// ==========================================
// 5. 搜索功能
// ==========================================
function runSearch() {
  const q = $('query').value.trim();
  if (!q) return;
  if (!state.extractedText) return alert('Upload and analyze a file first.');

  const text = state.extractedText;
  const lowText = text.toLowerCase();
  const needle = q.toLowerCase();
  
  let pos = 0, n = 0;
  let results = '';
  
  while ((pos = lowText.indexOf(needle, pos)) !== -1 && n < 10) {
    let start = Math.max(0, pos - 80);
    let end = Math.min(text.length, pos + q.length + 100);
    let snippet = text.slice(start, end).replace(/\s+/g, ' ');
    
    // 简单的正则高亮
    let highlighted = snippet.replace(new RegExp(q, 'gi'), match => `<mark class="hl-query">${match}</mark>`);
    // 高亮日期
    highlighted = highlighted.replace(/\b\d{4}-\d{2}-\d{2}\b/g, match => `<mark class="hl-date">${match}</mark>`);

    results += `<div class="source">...${highlighted}...</div>`;
    pos += needle.length;
    n++;
  }

  $('searchResults').innerHTML = n > 0 ? results : '<span class="text-slate-500">No matches found.</span>';
}

// ==========================================
// 6. 模态框 & 设置
// ==========================================
function openNewProjectModal() {
  $('modalContainer').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)this.remove()">
      <div class="modal">
        <h3 class="font-bold text-lg mb-4">Create New Project</h3>
        <div class="space-y-3 text-sm">
          <div><label class="font-bold text-xs">Project Name</label><input id="np-name" class="input mt-1" placeholder="e.g. Hospital Extension"></div>
          <div><label class="font-bold text-xs">Contract Type</label><input id="np-contract" class="input mt-1" placeholder="e.g. Main Building Works"></div>
          <div><label class="font-bold text-xs">Reference</label><input id="np-ref" class="input mt-1" placeholder="e.g. W/12345"></div>
        </div>
        <div class="flex justify-end gap-2 mt-6">
          <button class="btn secondary" onclick="$('modalContainer').innerHTML=''">Cancel</button>
          <button class="btn" onclick="createProject()">Create</button>
        </div>
      </div>
    </div>
  `;
}

function createProject() {
  const name = $('np-name').value.trim();
  if (!name) return alert('Name is required');
  const p = {
    id: 'p' + Date.now(),
    name: name,
    contract: $('np-contract').value.trim(),
    ref: $('np-ref').value.trim()
  };
  state.projects.push(p);
  saveProjects();
  $('modalContainer').innerHTML = '';
  renderHome();
}

function openSettings() {
  const c = loadCfg();
  $('modalContainer').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)this.remove()">
      <div class="modal">
        <h3 class="font-bold text-lg mb-1">API Settings</h3>
        <p class="text-xs text-slate-500 mb-4">Key is saved locally in this browser.</p>
        <div class="space-y-3 text-sm">
          <div><label class="font-bold text-xs">Endpoint</label><input id="cfg-endpoint" class="input mt-1" value="${c.endpoint||''}" placeholder="https://.../v1"></div>
          <div><label class="font-bold text-xs">API Key</label><input id="cfg-key" type="password" class="input mt-1" value="${c.apiKey||''}"></div>
          <div><label class="font-bold text-xs">Model Name</label><input id="cfg-model" class="input mt-1" value="${c.model||''}" placeholder="deepseek-chat"></div>
        </div>
        <div class="flex justify-end gap-2 mt-6">
          <button class="btn secondary" onclick="$('modalContainer').innerHTML=''">Cancel</button>
          <button class="btn" onclick="saveSettings()">Save Config</button>
        </div>
      </div>
    </div>
  `;
}

function saveSettings() {
  const cfg = {
    endpoint: $('cfg-endpoint').value.trim(),
    apiKey: $('cfg-key').value.trim(),
    model: $('cfg-model').value.trim()
  };
  localStorage.setItem('qs_cfg', JSON.stringify(cfg));
  $('modalContainer').innerHTML = '';
  alert('Settings Saved!');
}

// 启动
render();
</script>
</body>
</html>
