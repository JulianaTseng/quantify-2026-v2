<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QS SMART AI - quantify team</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root { --blue-primary: #004AAD; --bg-main: #f4f7fa; }
    body { background: var(--bg-main); color: #1e293b; font-family: system-ui, -apple-system, sans-serif; }
    .card { background: white; border: 1px solid #d4e3f0; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0, 74, 173, 0.04); }
    .tab { padding: 12px 18px; border-bottom: 3px solid transparent; font-weight: 600; font-size: 13px; color: #64748b; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .tab:hover { color: var(--blue-primary); }
    .tab.active { border-color: var(--blue-primary); color: var(--blue-primary); background: #CBE6F7; }
    .section { display: none; }
    .section.active { display: block; }
    .btn { padding: 8px 14px; border-radius: 8px; background: var(--blue-primary); color: white; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; border: none; }
    .btn:hover { background: #00337a; }
    .btn.secondary { background: #fff; color: var(--blue-primary); border: 1px solid var(--blue-primary); }
    .btn.secondary:hover { background: #CBE6F7; }
    .input { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; outline: none; }
    .input:focus { border-color: var(--blue-primary); box-shadow: 0 0 0 2px #CBE6F7; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: white; border-radius: 12px; width: 100%; max-width: 500px; padding: 24px; }
    /* Accordion for VOs */
    details { border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 10px; background: #fff; }
    summary { padding: 12px 16px; font-weight: 600; cursor: pointer; background: #f8fafc; border-radius: 8px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
    summary::-webkit-details-marker { display: none; }
    details[open] summary { border-bottom: 1px solid #e2e8f0; border-radius: 8px 8px 0 0; }
    .detail-content { padding: 16px; font-size: 13px; }
  </style>
</head>
<body>

<header class="bg-white border-b sticky top-0 z-30 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 cursor-pointer" onclick="goHome()">
      <div class="bg-[#004AAD] text-white font-black px-3 py-1.5 rounded-lg text-lg tracking-wider">QS</div>
      <div>
        <h1 class="text-xl font-extrabold text-[#004AAD]">QS SMART AI</h1>
        <p class="text-xs text-slate-500">by quantify team</p>
      </div>
    </div>
    <div class="flex gap-2">
      <button class="btn secondary" onclick="openSettingsModal()">⚙️ API Settings</button>
    </div>
  </div>
  <!-- Main Nav Tabs (Only show in project view) -->
  <nav id="mainNav" class="max-w-7xl mx-auto px-4 flex overflow-x-auto border-t border-slate-100 hidden">
    <button class="tab active" data-tab="tab1" onclick="switchTab('tab1')">1. Doc Reader & Classification</button>
    <button class="tab" data-tab="tab2" onclick="switchTab('tab2')">2. Key Dates & Clauses</button>
    <button class="tab" data-tab="tab3" onclick="switchTab('tab3')">3. VO & SOP Timer</button>
    <button class="tab" data-tab="tab4" onclick="switchTab('tab4')">4. VO Organizer</button>
    <button class="tab" data-tab="tab5" onclick="switchTab('tab5')">5. GCC/SCC Check & Calc</button>
  </nav>
</header>

<main class="max-w-7xl mx-auto p-4 pt-6" id="appContainer">
  <!-- Dynamic Content Rendered Here -->
</main>

<div id="modalContainer"></div>

<script>
// Setup PDF.js worker
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

// ==========================================
// 1. State Management
// ==========================================
let state = {
  view: 'home', 
  projects: JSON.parse(localStorage.getItem('qs_projects')) || [
    { id: 'p1', name: 'Zung Fu Retail Project', contract: 'Enabling Works', ref: 'W/114105' },
    { id: 'p2', name: 'Hospital Extension Phase 2', contract: 'Main Building Works', ref: 'W/998822' }
  ],
  currentProject: null,
  activeTab: 'tab1',
  files: [], // { name, text, pages }
  aiData: null, // Structured JSON from AI
  isAnalyzing: false
};

function saveProjects() { localStorage.setItem('qs_projects', JSON.stringify(state.projects)); }
function loadCfg() { try { return JSON.parse(localStorage.getItem('qs_cfg') || '{}'); } catch { return {}; } }
const $ = id => document.getElementById(id);
const $$ = selector => document.querySelectorAll(selector);

// ==========================================
// 2. Routing & Rendering
// ==========================================
function render() {
  const nav = $('mainNav');
  if (state.view === 'home') {
    nav.classList.add('hidden');
    renderHome();
  } else {
    nav.classList.remove('hidden');
    renderProject();
  }
}

function goHome() { state.view = 'home'; state.currentProject = null; state.files = []; state.aiData = null; render(); }

function openProject(id) {
  state.currentProject = state.projects.find(p => p.id === id);
  state.view = 'project';
  state.files = [];
  state.aiData = null;
  state.activeTab = 'tab1';
  switchTab('tab1');
  render();
}

function switchTab(tabId) {
  state.activeTab = tabId;
  $$('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
  $$('.section').forEach(s => s.classList.toggle('active', s.id === tabId));
}

// --- Homepage ---
function renderHome() {
  const cards = state.projects.map(p => `
    <div class="card cursor-pointer hover:border-[#004AAD] transition border-2 border-transparent" onclick="openProject('${p.id}')">
      <h3 class="font-bold text-lg text-slate-800">${p.name}</h3>
      <p class="text-xs text-slate-500 mt-1">${p.contract || 'No contract info'}</p>
      <p class="text-xs text-[#004AAD] font-mono mt-2">${p.ref || ''}</p>
    </div>
  `).join('');

  $('appContainer').innerHTML = `
    <div class="mb-6">
      <h2 class="text-2xl font-bold text-slate-900">Projects</h2>
      <p class="text-sm text-slate-500">Select a project to upload documents and extract key information.</p>
    </div>
    <div class="grid md:grid-cols-3 gap-4">
      ${cards}
      <div class="card border-dashed border-2 flex flex-col items-center justify-center cursor-pointer hover:bg-slate-50 text-slate-500 min-h-[120px]" onclick="openNewProjectModal()">
        <span class="text-3xl mb-2">+</span>
        <span class="font-bold text-sm">New project</span>
      </div>
    </div>
  `;
}

// --- Project View ---
function renderProject() {
  const p = state.currentProject;
  $('appContainer').innerHTML = `
    <div class="mb-6 flex justify-between items-end">
      <div>
        <button class="text-xs text-slate-500 hover:text-[#004AAD] mb-2 font-bold" onclick="goHome()">← Back to Projects</button>
        <h2 class="text-2xl font-bold text-slate-900">${p.name}</h2>
        <p class="text-sm text-slate-500">${p.contract || ''} ${p.ref ? '· ' + p.ref : ''}</p>
      </div>
      <div class="flex gap-2">
        <button class="btn secondary" onclick="refreshProject()">🔄 Clear Project Files</button>
      </div>
    </div>

    <!-- TAB 1: Upload & Reader -->
    <section id="tab1" class="section ${state.activeTab === 'tab1' ? 'active' : ''}">
      <div class="grid lg:grid-cols-3 gap-6">
        <div class="card border-2 border-dashed border-[#004AAD] text-center py-10 cursor-pointer" onclick="$('fileInput').click()">
          <div class="text-4xl mb-2">📄</div>
          <b class="text-sm text-slate-800">Click to upload PDF/TXT</b>
          <p class="text-xs text-slate-500 mt-1">Upload GCC, SCC, VO, and AI docs.</p>
          <input type="file" id="fileInput" class="hidden" accept=".pdf,.txt" multiple onchange="handleFiles(this.files)">
        </div>
        <div class="card lg:col-span-2 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-center border-b pb-2 mb-3">
              <h3 class="font-bold text-sm text-slate-800">Loaded Documents</h3>
              <span class="bg-[#CBE6F7] text-[#004AAD] px-2 py-0.5 rounded text-xs font-bold" id="fileCount">0 files</span>
            </div>
            <ul id="fileList" class="space-y-2 text-sm max-h-48 overflow-y-auto mb-4">
              <li class="text-slate-400 text-xs italic">No files uploaded yet.</li>
            </ul>
          </div>
          <div class="bg-[#004AAD] p-4 rounded-lg text-white">
            <b class="text-xs uppercase text-[#CBE6F7]">AI Analysis Engine</b>
            <p class="text-xs text-slate-200 mt-1 mb-3">Sends text to AI to identify contract sections, dates, VOs, and GCC/SCC mappings.</p>
            <button id="btnAnalyze" class="btn bg-white text-[#004AAD] w-full" onclick="runAIAnalysis()" disabled>Run AI Analysis</button>
            <div id="progressLog" class="text-xs mt-2 text-[#CBE6F7] min-h-[20px]"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- TAB 2: Key Dates & Clauses -->
    <section id="tab2" class="section ${state.activeTab === 'tab2' ? 'active' : ''}">
      <div id="tab2Content" class="text-center text-slate-500 py-10">Run AI analysis in Tab 1 to view data.</div>
    </section>

    <!-- TAB 3: VO & SOP Timer -->
    <section id="tab3" class="section ${state.activeTab === 'tab3' ? 'active' : ''}">
      <div id="tab3Content" class="text-center text-slate-500 py-10">Run AI analysis in Tab 1 to view data.</div>
    </section>

    <!-- TAB 4: VO Organizer -->
    <section id="tab4" class="section ${state.activeTab === 'tab4' ? 'active' : ''}">
      <div id="tab4Content" class="text-center text-slate-500 py-10">Run AI analysis in Tab 1 to view data.</div>
    </section>

    <!-- TAB 5: GCC/SCC & Calc -->
    <section id="tab5" class="section ${state.activeTab === 'tab5' ? 'active' : ''}">
      <div class="grid lg:grid-cols-2 gap-6">
        <div id="tab5Content" class="text-center text-slate-500 py-10">Run AI analysis to view GCC/SCC mappings.</div>
        
        <!-- Timeline Calculator -->
        <div class="card space-y-3">
          <h3 class="font-bold text-sm border-b pb-2">Cap. 652 Timeline Calculator</h3>
          <label class="block text-xs font-bold text-slate-700">Claim Notice Date
            <input id="calcDate" type="date" class="input mt-1">
          </label>
          <label class="block text-xs font-bold text-slate-700">Response Period (Days)
            <select id="calcDays" class="input mt-1">
              <option value="30">30 Days (Cap. 652 Default)</option>
              <option value="21">21 Days</option>
              <option value="14">14 Days</option>
            </select>
          </label>
          <button class="btn w-full" onclick="runCalculator()">Generate Timeline</button>
          <div id="timelineOutput" class="text-xs text-slate-500 mt-4"></div>
        </div>
      </div>
    </section>
  `);

  // Initialize file list UI
  updateFileListUI();
}

function refreshProject() {
  state.files = [];
  state.aiData = null;
  updateFileListUI();
  renderProject();
}

// ==========================================
// 3. File Handling & AI Integration
// ==========================================
async function handleFiles(fileList) {
  for (const file of fileList) {
    if (file.size > 50 * 1024 * 1024) { alert(file.name + ' is too large (max 50MB)'); continue; }
    
    let text = '', pages = 0;
    try {
      if (file.name.endsWith('.txt')) {
        text = await file.text();
      } else if (file.name.endsWith('.pdf')) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        pages = pdf.numPages;
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          text += content.items.map(x => x.str).join(' ') + '\n';
        }
      }
      state.files.push({ name: file.name, text, pages });
    } catch (e) {
      alert('Error reading ' + file.name + ': ' + e.message);
    }
  }
  updateFileListUI();
}

function updateFileListUI() {
  $('fileCount').innerText = state.files.length + ' files';
  if (state.files.length === 0) {
    $('fileList').innerHTML = '<li class="text-slate-400 text-xs italic">No files uploaded yet.</li>';
    $('btnAnalyze').disabled = true;
  } else {
    $('fileList').innerHTML = state.files.map(f => `
      <li class="flex justify-between items-center bg-slate-50 p-2 rounded border">
        <span class="truncate w-3/4" title="${f.name}">${f.name}</span>
        <span class="text-xs text-slate-500">${f.pages ? f.pages + 'p' : 'txt'}</span>
      </li>
    `).join('');
    $('btnAnalyze').disabled = false;
  }
}

async function runAIAnalysis() {
  if (state.files.length === 0 || state.isAnalyzing) return;
  const cfg = loadCfg();
  if (!cfg.endpoint || !cfg.apiKey || !cfg.model) return alert('Please configure API Settings first.');

  state.isAnalyzing = true;
  $('btnAnalyze').disabled = true;
  $('btnAnalyze').innerText = 'Processing...';
  $('progressLog').innerText = 'Combining document texts...';

  try {
    // Combine text, limiting to ~40k characters to avoid API limits
    let combinedText = state.files.map(f => `--- File: ${f.name} ---\n${f.text}`).join('\n\n');
    if (combinedText.length > 40000) {
      combinedText = combinedText.substring(0, 40000) + '\n\n[TRUNCATED DUE TO LENGTH]';
      $('progressLog').innerText = 'Warning: Text truncated to 40k chars.';
    }

    $('progressLog').innerText = 'AI is extracting structured data...';

    // VERY STRICT PROMPT
    const systemPrompt = `You are an expert Quantity Surveyor and Legal Auditor in Hong Kong.
Analyze the provided text which contains GCC, SCC, and VO documents.
Extract information and YOU MUST RESPOND WITH A VALID RAW JSON OBJECT ONLY, no markdown blocks like \`\`\`json.
Format exactly as follows:
{
  "documents": [{"name": "Filename", "type": "GCC | SCC | VO | AI | Other", "summary": "Brief description"}],
  "key_dates": [{"date": "YYYY-MM-DD", "event": "Description", "source": "Filename"}],
  "key_clauses": [{"clause": "Clause Number", "source": "GCC | SCC | VO", "text": "Exact quote or summary", "impact": "Why it matters"}],
  "vo_details": [
    {
      "vo_number": "VO-01",
      "amount": "HK$ 1,000,000",
      "date_issued": "YYYY-MM-DD",
      "date_submitted": "YYYY-MM-DD",
      "status": "Pending | Approved | Time-barred",
      "sop_check": "Compliant | Overdue"
    }
  ],
  "scc_gcc_mapping": [
    {"scc_ref": "SCC 13", "gcc_ref": "GCC 13", "change": "Description of what was altered/deleted/added"}
  ]
}
If a section has no data, return an empty array [].`;

    let url = cfg.endpoint.replace(/\/$/, '');
    if (!url.endsWith('/chat/completions')) url = url.endsWith('/v1') ? url + '/chat/completions' : url + '/v1/chat/completions';

    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
      body: JSON.stringify({
        model: cfg.model,
        messages: [
          { role: "system", content: systemPrompt },
          { role: "user", content: "Here is the document text:\n\n" + combinedText }
        ],
        temperature: 0.1 // Keep very low for JSON consistency
      })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error?.message || "API Error");

    let rawContent = data.choices[0].message.content;
    // Strip markdown if AI ignores instructions
    rawContent = rawContent.replace(/```json/g, '').replace(/```/g, '').trim();
    
    state.aiData = JSON.parse(rawContent);
    
    // Render all tabs with new data
    renderDashboard();
    renderTab2();
    renderTab3();
    renderTab4();
    renderTab5();
    
    $('progressLog').innerText = 'Analysis Complete! Check other tabs.';
    switchTab('tab2'); // Automatically jump to results

  } catch (error) {
    console.error(error);
    $('progressLog').innerText = 'Error: ' + error.message;
    alert('Analysis failed: ' + error.message);
  } finally {
    state.isAnalyzing = false;
    $('btnAnalyze').disabled = false;
    $('btnAnalyze').innerText = 'Re-run AI Analysis';
  }
}

// ==========================================
// 4. Render Tabs Based on AI Data
// ==========================================
function renderDashboard() {
  const d = state.aiData;
  if (!d) return;

  const docList = d.documents.map(doc => `
    <div class="flex items-center justify-between p-3 border-b last:border-0">
      <div>
        <b class="text-slate-800 block text-sm">${doc.name}</b>
        <span class="text-xs text-slate-500">${doc.summary}</span>
      </div>
      <span class="bg-[#004AAD] text-white px-2 py-1 rounded text-[10px] font-bold uppercase">${doc.type}</span>
    </div>
  `).join('');

  $('tab1').innerHTML += `
    <div class="card mt-6">
      <h3 class="font-bold text-sm border-b pb-2 mb-3 text-slate-800">AI Document Classification</h3>
      ${docList || '<span class="text-slate-400 text-xs">No documents classified.</span>'}
    </div>
  `;
}

function renderTab2() {
  const d = state.aiData;
  if (!d) return;

  const dateHtml = d.key_dates.map(dt => `
    <li class="flex justify-between py-2 border-b last:border-0 text-sm">
      <span class="font-mono text-[#004AAD] font-bold w-24 shrink-0">${dt.date}</span>
      <span class="text-slate-700 flex-1">${dt.event}</span>
      <span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded">${dt.source}</span>
    </li>
  `).join('');

  const clauseHtml = d.key_clauses.map(c => `
    <div class="p-3 border-l-4 border-[#004AAD] bg-slate-50 mb-2 text-sm">
      <div class="flex justify-between mb-1">
        <b class="text-[#004AAD]">${c.source} - ${c.clause}</b>
      </div>
      <p class="text-slate-800 font-medium mb-1">${c.text}</p>
      <p class="text-slate-500 text-xs">Impact: ${c.impact}</p>
    </div>
  `).join('');

  $('tab2Content').innerHTML = `
    <div class="grid md:grid-cols-2 gap-6">
      <div class="card">
        <h3 class="font-bold text-sm border-b pb-2 mb-3 text-slate-800">Highlighted Key Dates</h3>
        <ul>${dateHtml || '<li class="text-slate-400 text-xs">No dates found.</li>'}</ul>
      </div>
      <div class="card">
        <h3 class="font-bold text-sm border-b pb-2 mb-3 text-slate-800">Key Clauses & Alterations</h3>
        ${clauseHtml || '<span class="text-slate-400 text-xs">No clauses found.</span>'}
      </div>
    </div>
  `;
}

function renderTab3() {
  const d = state.aiData;
  if (!d) return;
  
  // Auto-fill calc if dates exist
  if (d.key_dates && d.key_dates.length > 0) {
    const sorted = [...d.key_dates].sort((a,b) => new Date(a.date) - new Date(b.date));
    $('calcDate').value = sorted[0].date;
    runCalculator();
  }

  const voHtml = d.vo_details.map(vo => `
    <div class="card mb-4 border-l-4 ${vo.sop_check === 'Overdue' ? 'border-red-500' : 'border-emerald-500'}">
      <div class="flex justify-between items-start mb-2">
        <div>
          <h4 class="font-bold text-slate-800 text-lg">${vo.vo_number}</h4>
          <span class="text-xs text-slate-500">Issued: ${vo.date_issued} | Submitted: ${vo.date_submitted}</span>
        </div>
        <span class="bg-slate-100 text-slate-700 font-bold px-3 py-1 rounded">${vo.amount}</span>
      </div>
      <div class="flex gap-2 text-xs mt-3">
        <span class="bg-blue-100 text-blue-800 px-2 py-1 rounded font-bold">Status: ${vo.status}</span>
        <span class="${vo.sop_check === 'Overdue' ? 'bg-red-100 text-red-800' : 'bg-emerald-100 text-emerald-800'} px-2 py-1 rounded font-bold">SOP Timer: ${vo.sop_check}</span>
      </div>
    </div>
  `).join('');

  $('tab3Content').innerHTML = `
    <div class="mb-4">
      <h2 class="text-xl font-bold text-slate-900">VO Verification & SOP Timer</h2>
      <p class="text-sm text-slate-500">Checks VO submission against SCC time-bars and Cap. 652.</p>
    </div>
    <div class="grid md:grid-cols-2 gap-6">
      <div>
        ${voHtml || '<div class="card text-slate-400 text-sm">No VO details found.</div>'}
      </div>
      <div class="card">
         <h3 class="font-bold text-sm border-b pb-2 mb-3 text-slate-800">Required Actions</h3>
         <ul class="text-sm space-y-2 text-slate-700">
           ${d.vo_details.some(v => v.sop_check === 'Overdue') 
              ? '<li class="text-red-600 font-bold">⚠️ Warning: One or more VOs exceed the statutory response period.</li>' 
              : '<li class="text-emerald-600 font-bold">✔ All extracted VOs appear within time limits.</li>'}
           <li>Review SCC 28.2 for detailed claim particulars.</li>
           <li>Ensure VO responses are served within 30 days of submission.</li>
         </ul>
      </div>
    </div>
  `;
}

function renderTab4() {
  const d = state.aiData;
  if (!d) return;

  const accordion = d.vo_details.map(vo => `
    <details>
      <summary>
        <div class="flex justify-between w-full pr-4">
          <span>${vo.vo_number} - ${vo.amount}</span>
          <span class="text-xs text-slate-500">${vo.date_issued}</span>
        </div>
      </summary>
      <div class="detail-content">
        <table class="w-full text-left border-collapse">
          <tr class="border-b"><th class="py-1 text-slate-500 font-normal w-1/3">Amount</th><td class="font-bold">${vo.amount}</td></tr>
          <tr class="border-b"><th class="py-1 text-slate-500 font-normal">Date Issued</th><td>${vo.date_issued}</td></tr>
          <tr class="border-b"><th class="py-1 text-slate-500 font-normal">Date Submitted</th><td>${vo.date_submitted}</td></tr>
          <tr class="border-b"><th class="py-1 text-slate-500 font-normal">Status</th><td>${vo.status}</td></tr>
          <tr><th class="py-1 text-slate-500 font-normal">SOP Check</th><td class="${vo.sop_check === 'Overdue' ? 'text-red-600 font-bold' : 'text-emerald-600 font-bold'}">${vo.sop_check}</td></tr>
        </table>
      </div>
    </details>
  `).join('');

  $('tab4Content').innerHTML = `
    <div class="mb-4">
      <h2 class="text-xl font-bold text-slate-900">VO Organizer</h2>
      <p class="text-sm text-slate-500">Expand VOs to compare details side-by-side.</p>
    </div>
    <div class="space-y-2">
      ${accordion || '<div class="text-slate-400 text-sm">No VOs found.</div>'}
    </div>
  `;
}

function renderTab5() {
  const d = state.aiData;
  if (!d) return;

  const mapHtml = d.scc_gcc_mapping.map(m => `
    <div class="flex gap-4 p-3 border-b last:border-0 text-sm items-start">
      <div class="w-1/3 shrink-0">
        <span class="bg-blue-100 text-blue-800 font-bold px-2 py-1 rounded block text-center mb-1">${m.scc_ref}</span>
      </div>
      <div class="text-slate-400 pt-1">➔</div>
      <div class="w-1/3 shrink-0">
        <span class="bg-slate-100 text-slate-800 font-bold px-2 py-1 rounded block text-center mb-1">${m.gcc_ref}</span>
      </div>
      <div class="flex-1 text-xs text-slate-600 mt-1">
        <b>Change:</b> ${m.change}
      </div>
    </div>
  `).join('');

  $('tab5Content').innerHTML = `
    <div class="card mb-6">
      <h3 class="font-bold text-sm border-b pb-2 mb-3 text-slate-800">SCC to GCC Mapping (Highlighting Alterations)</h3>
      ${mapHtml || '<span class="text-slate-400 text-xs">No mappings identified.</span>'}
    </div>
  `;
}

// ==========================================
// 5. Utilities & Modals
// ==========================================
function openNewProjectModal() {
  $('modalContainer').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)$('modalContainer').innerHTML=''">
      <div class="modal">
        <h3 class="font-bold text-lg mb-4">Create New Project</h3>
        <div class="space-y-3 text-sm">
          <div><label class="font-bold text-xs">Project Name</label><input id="np-name" class="input mt-1" placeholder="e.g. Hospital Extension"></div>
          <div><label class="font-bold text-xs">Contract Type</label><input id="np-contract" class="input mt-1" placeholder="e.g. Main Building Works"></div>
          <div><label class="font-bold text-xs">Reference</label><input id="np-ref" class="input mt-1" placeholder="e.g. W/12345"></div>
        </div>
        <div class="flex justify-end gap-2 mt-6">
          <button class="btn secondary" onclick="$('modalContainer').innerHTML=''">Cancel</button>
          <button class="btn" onclick="createProject()">Create</button>
        </div>
      </div>
    </div>
  `;
}

function createProject() {
  const name = $('np-name').value.trim();
  if (!name) return alert('Name is required');
  const p = {
    id: 'p' + Date.now(),
    name: name,
    contract: $('np-contract').value.trim(),
    ref: $('np-ref').value.trim()
  };
  state.projects.push(p);
  saveProjects();
  $('modalContainer').innerHTML = '';
  renderHome();
}

function openSettingsModal() {
  const c = loadCfg();
  $('modalContainer').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)$('modalContainer').innerHTML=''">
      <div class="modal">
        <h3 class="font-bold text-lg mb-1">API Settings</h3>
        <p class="text-xs text-slate-500 mb-4">Key is saved locally in this browser.</p>
        <div class="space-y-3 text-sm">
          <div><label class="font-bold text-xs">Endpoint</label><input id="cfg-endpoint" class="input mt-1" value="${c.endpoint||''}" placeholder="https://.../v1"></div>
          <div><label class="font-bold text-xs">API Key</label><input id="cfg-key" type="password" class="input mt-1" value="${c.apiKey||''}"></div>
          <div><label class="font-bold text-xs">Model Name</label><input id="cfg-model" class="input mt-1" value="${c.model||''}" placeholder="deepseek-chat"></div>
        </div>
        <div class="flex justify-end gap-2 mt-6">
          <button class="btn secondary" onclick="$('modalContainer').innerHTML=''">Cancel</button>
          <button class="btn" onclick="saveSettings()">Save Config</button>
        </div>
      </div>
    </div>
  `;
}

function saveSettings() {
  const cfg = {
    endpoint: $('cfg-endpoint').value.trim(),
    apiKey: $('cfg-key').value.trim(),
    model: $('cfg-model').value.trim()
  };
  localStorage.setItem('qs_cfg', JSON.stringify(cfg));
  $('modalContainer').innerHTML = '';
  alert('Settings Saved!');
}

function runCalculator() {
  const dateVal = $('calcDate').value;
  if (!dateVal) return;
  const days = parseInt($('calcDays').value);
  
  const start = new Date(dateVal);
  const deadline = new Date(start);
  deadline.setDate(deadline.getDate() + days);
  
  const today = new Date();
  const diffTime = deadline - today;
  const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

  const isOverdue = diffDays < 0;
  const colorClass = isOverdue ? 'text-red-600' : 'text-emerald-600';

  $('timelineOutput').innerHTML = `
    <div class="p-4 rounded-lg border ${isOverdue ? 'bg-red-50 border-red-200' : 'bg-emerald-50 border-emerald-200'} mb-4">
      <div class="text-sm font-bold ${colorClass}">
        ${isOverdue ? '❌ RESPONSE OVERDUE' : '✔ ' + diffDays + ' DAYS REMAINING'}
      </div>
      <p class="text-xs text-slate-600 mt-1">
        Statutory Deadline: <b>${deadline.toISOString().split('T')[0]}</b>
      </p>
    </div>
    <div class="relative border-l-2 border-[#004AAD] ml-3 pl-6 space-y-6">
      <div class="relative">
        <div class="absolute -left-[31px] top-0 bg-[#004AAD] text-white w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold">1</div>
        <b class="text-slate-800 text-sm block">Payment Claim Received</b>
        <span class="text-[#004AAD] font-mono text-xs font-bold">${start.toISOString().split('T')[0]}</span>
      </div>
      <div class="relative">
        <div class="absolute -left-[31px] top-0 ${isOverdue ? 'bg-red-500' : 'bg-amber-500'} text-white w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold">2</div>
        <b class="text-slate-800 text-sm block">Payment Response Deadline</b>
        <span class="text-amber-600 font-mono text-xs font-bold">${deadline.toISOString().split('T')[0]}</span>
      </div>
    </div>
  `;
}

// Start
render();
</script>
