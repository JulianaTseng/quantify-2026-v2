<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QS SMART AI — by quantify team</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { DEFAULT: '#004AAD', dark: '#003B8A', light: '#E8F0FB' }
        }
      }
    }
  };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  summary::-webkit-details-marker { display: none; }
  details[open] .chev { transform: rotate(90deg); }
  html { scroll-behavior: smooth; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
</style>
</head>
<body class="bg-slate-50 min-h-screen antialiased text-slate-800">

<!-- ============ GLOBAL HEADER ============ -->
<header class="bg-brand text-white sticky top-0 z-40 shadow-md">
  <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
    <button onclick="goHome()" class="flex items-center gap-3 text-left">
      <span class="w-9 h-9 rounded-lg bg-white/15 grid place-items-center font-bold text-sm">QS</span>
      <span class="leading-tight">
        <span class="block font-semibold tracking-wide">QS SMART AI</span>
        <span class="block text-[10px] text-white/70">by quantify team</span>
      </span>
    </button>
    <button onclick="openSettings()" class="flex items-center gap-2 text-sm bg-white/10 hover:bg-white/20 px-3 py-2 rounded-lg transition" title="API Settings">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span class="hidden sm:inline">API Settings</span>
    </button>
  </div>
</header>

<main>
  <!-- ============ VIEW: HOME ============ -->
  <section id="view-home" class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex items-end justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Projects</h1>
        <p class="text-sm text-slate-500 mt-1">Each project keeps its own documents, AI analysis and VO records.</p>
      </div>
      <button onclick="openNewProject()" class="shrink-0 bg-brand hover:bg-brand-dark text-white text-sm font-semibold px-4 py-2.5 rounded-lg shadow-sm transition">
        + New Project
      </button>
    </div>
    <div id="projectGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </section>

  <!-- ============ VIEW: WORKSPACE ============ -->
  <section id="view-workspace" class="hidden max-w-7xl mx-auto px-4 py-6">
    <div class="flex items-center gap-3 mb-5 flex-wrap">
      <button onclick="goHome()" class="text-sm text-slate-600 hover:text-brand border border-slate-200 bg-white px-3 py-2 rounded-lg transition">← Projects</button>
      <h1 id="projTitle" class="text-xl font-bold text-slate-900"></h1>
      <span id="projMeta" class="text-xs text-slate-500"></span>
    </div>
    <div id="tabBar" class="flex gap-2 overflow-x-auto pb-1 mb-5"></div>
    <div id="panelHost"></div>
  </section>
</main>

<!-- ============ MODAL: API SETTINGS ============ -->
<div id="modalSettings" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-6">
    <div class="flex items-start justify-between mb-1">
      <h2 class="text-lg font-bold text-slate-900">API Settings</h2>
      <button onclick="closeSettings()" class="text-slate-400 hover:text-slate-700 text-2xl leading-none -mt-1">×</button>
    </div>
    <p class="text-xs text-slate-500 mb-4">Any OpenAI-compatible endpoint (DeepSeek, Moyu proxy, OpenAI…). Stored locally in your browser only.</p>

    <label class="block text-xs font-semibold text-slate-600 mb-1">Endpoint URL</label>
    <input id="setEndpoint" type="text" placeholder="https://api.deepseek.com/v1"
      class="w-full mb-3 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">

    <label class="block text-xs font-semibold text-slate-600 mb-1">API Key</label>
    <input id="setApiKey" type="password" placeholder="sk-..."
      class="w-full mb-3 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">

    <label class="block text-xs font-semibold text-slate-600 mb-1">Model Name</label>
    <input id="setModel" type="text" placeholder="deepseek-chat"
      class="w-full mb-3 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">

    <div id="testResult" class="text-xs mb-3 min-h-[1rem]"></div>

    <div class="flex items-center gap-2">
      <button onclick="testConnection()" class="text-sm px-3 py-2 rounded-lg border border-slate-300 hover:bg-slate-50 transition">Test Connection</button>
      <div class="ml-auto flex gap-2">
        <button onclick="closeSettings()" class="text-sm px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100 transition">Cancel</button>
        <button onclick="saveSettings()" class="text-sm px-4 py-2 rounded-lg bg-brand text-white font-semibold hover:bg-brand-dark transition">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ MODAL: NEW PROJECT ============ -->
<div id="modalNewProject" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6">
    <h2 class="text-lg font-bold text-slate-900 mb-1">New Project</h2>
    <p class="text-xs text-slate-500 mb-4">e.g. “Contract 1234 – Hospital Extension”.</p>
    <input id="newProjName" type="text" placeholder="Project name"
      class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">
    <div class="flex justify-end gap-2">
      <button onclick="closeNewProject()" class="text-sm px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100 transition">Cancel</button>
      <button onclick="confirmNewProject()" class="text-sm px-4 py-2 rounded-lg bg-brand text-white font-semibold hover:bg-brand-dark transition">Create</button>
    </div>
  </div>
</div>

<!-- ============ TOAST ============ -->
<div id="toast" class="hidden"></div>

<script>
/* =========================================================
   QS SMART AI — pure frontend SPA (no routing, no backend)
   ========================================================= */

const LS_PROJECTS = 'qssmart_projects_v1';
const LS_SETTINGS = 'qssmart_settings_v1';

const state = {
  projects: [],
  settings: { endpoint: '', apiKey: '', model: 'deepseek-chat' },
  currentId: null,
  tab: 'doc',
  sopPeriod: 30,
  busy: false
};

const TABS = [
  { key: 'doc',       label: '1 · Documents' },
  { key: 'dates',     label: '2 · Key Dates & Clauses' },
  { key: 'timer',     label: '3 · VO & SOP Timer' },
  { key: 'organizer', label: '4 · VO Organizer' },
  { key: 'check',     label: '5 · GCC/SCC & Calculator' }
];

const TYPE_COLORS = {
  GCC: 'bg-blue-100 text-blue-700',
  SCC: 'bg-indigo-100 text-indigo-700',
  VO:  'bg-amber-100 text-amber-700',
  AI:  'bg-purple-100 text-purple-700',
  Other: 'bg-slate-100 text-slate-600'
};

/* ---------------- utils ---------------- */
const $  = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = (s = '') => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d)) return esc(String(s));
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' });
}
function parseDate(s) {
  if (!s) return null;
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function utcToday() {
  const n = new Date();
  return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
}
function fmtBytes(n) {
  if (!n && n !== 0) return '';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}
function badge(label, cls) {
  const map = {
    emerald: 'bg-emerald-100 text-emerald-700',
    rose:    'bg-rose-100 text-rose-700',
    amber:   'bg-amber-100 text-amber-700',
    slate:   'bg-slate-100 text-slate-600',
    blue:    'bg-blue-100 text-blue-700'
  };
  return `<span class="inline-block text-[11px] font-semibold px-2 py-0.5 rounded-full ${map[cls] || map.slate}">${esc(label)}</span>`;
}
function emptyState(icon, title, sub) {
  return `<div class="text-center py-10 px-4">
    <div class="text-3xl mb-2">${icon}</div>
    <p class="font-medium text-slate-700">${esc(title)}</p>
    <p class="text-sm text-slate-400 mt-1">${esc(sub)}</p>
  </div>`;
}

let toastTimer;
function toast(msg, type = 'info') {
  const el = $('#toast');
  const colors = { ok: 'bg-emerald-600', warn: 'bg-amber-500', error: 'bg-rose-600', info: 'bg-slate-800' };
  el.className = `fixed bottom-5 left-1/2 -translate-x-1/2 z-[100] text-white text-sm px-4 py-2.5 rounded-lg shadow-lg max-w-[90vw] ${colors[type] || colors.info}`;
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 5000);
}

/* ---------------- persistence ---------------- */
function loadState() {
  try {
    const p = JSON.parse(localStorage.getItem(LS_PROJECTS) || '[]');
    if (Array.isArray(p)) state.projects = p;
  } catch (e) { console.warn('projects load failed', e); }
  try {
    const s = JSON.parse(localStorage.getItem(LS_SETTINGS) || '{}');
    state.settings = Object.assign({ endpoint: '', apiKey: '', model: 'deepseek-chat' }, s);
  } catch (e) { console.warn('settings load failed', e); }
}

function saveProjects() {
  try {
    localStorage.setItem(LS_PROJECTS, JSON.stringify(state.projects));
    return true;
  } catch (e) {
    // Quota exceeded → retry without the heavy extracted text
    try {
      const stripped = state.projects.map(p => ({ ...p, files: (p.files || []).map(f => ({ ...f, text: '' })) }));
      localStorage.setItem(LS_PROJECTS, JSON.stringify(stripped));
      toast('Storage limit reached — extracted text was not persisted. Re-upload after refresh.', 'warn');
    } catch (e2) {
      toast('Could not save: browser storage is full.', 'error');
    }
    return false;
  }
}

function currentProject() {
  return state.projects.find(p => p.id === state.currentId) || null;
}
function touch(p) { p.updatedAt = Date.now(); }

/* ---------------- render root ---------------- */
function render() {
  if (state.currentId) {
    $('#view-home').classList.add('hidden');
    $('#view-workspace').classList.remove('hidden');
    renderWorkspace();
  } else {
    $('#view-workspace').classList.add('hidden');
    $('#view-home').classList.remove('hidden');
    renderHome();
  }
}

function renderHome() {
  const grid = $('#projectGrid');
  if (!state.projects.length) {
    grid.innerHTML = `<div class="col-span-full">${emptyState('🗂️', 'No projects yet', 'Create your first project to start analysing contracts and VOs.')}</div>`;
    return;
  }
  grid.innerHTML = state.projects.map(p => `
    <div class="group relative bg-white rounded-xl border border-slate-200 p-5 hover:shadow-lg hover:border-brand/40 transition cursor-pointer"
         onclick="openProject('${p.id}')">
      <div class="flex items-start justify-between">
        <div class="w-10 h-10 rounded-lg bg-brand-light grid place-items-center text-brand font-bold text-sm">
          ${esc((p.name || 'P').replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || 'QS')}
        </div>
        <button onclick="deleteProject(event,'${p.id}')"
          class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-rose-600 transition text-sm px-2 py-1 rounded hover:bg-rose-50"
          title="Delete project">✕</button>
      </div>
      <h3 class="mt-3 font-semibold text-slate-900 truncate">${esc(p.name)}</h3>
      <p class="text-xs text-slate-500 mt-1">${(p.files || []).length} file(s) · ${p.analysis ? 'Analyzed' : 'Not analyzed'}</p>
      <p class="text-[11px] text-slate-400 mt-3">Updated ${new Date(p.updatedAt || p.createdAt).toLocaleDateString('en-GB')}</p>
    </div>`).join('');
}

function renderWorkspace() {
  const p = currentProject();
  if (!p) { state.currentId = null; render(); return; }

  $('#projTitle').textContent = p.name;
  $('#projMeta').textContent = `${(p.files || []).length} file(s) · ` +
    (p.analysis ? 'Analyzed ' + new Date(p.analyzedAt).toLocaleString('en-GB') : 'Not analyzed yet');

  $('#tabBar').innerHTML = TABS.map(t => `
    <button onclick="switchTab('${t.key}')"
      class="whitespace-nowrap px-3.5 py-2 rounded-lg text-sm font-medium transition
      ${state.tab === t.key
        ? 'bg-brand text-white shadow-sm'
        : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">${t.label}</button>`).join('');

  $('#panelHost').innerHTML = renderPanel(state.tab, p);
  bindPanel();
}

function switchTab(key) { state.tab = key; renderWorkspace(); }
function openProject(id) { state.currentId = id; state.tab = 'doc'; render(); }
function goHome() { state.currentId = null; state.tab = 'doc'; render(); }

/* ---------------- project CRUD ---------------- */
function openNewProject() {
  $('#newProjName').value = '';
  $('#modalNewProject').classList.remove('hidden');
  setTimeout(() => $('#newProjName').focus(), 50);
}
function closeNewProject() { $('#modalNewProject').classList.add('hidden'); }
function confirmNewProject() {
  const name = ($('#newProjName').value || '').trim() || 'Untitled Project';
  const p = {
    id: uid(), name, createdAt: Date.now(), updatedAt: Date.now(),
    files: [], analysis: null, analyzedAt: null
  };
  state.projects.unshift(p);
  saveProjects();
  closeNewProject();
  state.currentId = p.id;
  state.tab = 'doc';
  render();
}
function deleteProject(e, id) {
  e.stopPropagation();
  if (!confirm('Delete this project and all of its saved data?')) return;
  state.projects = state.projects.filter(p => p.id !== id);
  if (state.currentId === id) state.currentId = null;
  saveProjects();
  render();
}

/* ---------------- panel dispatch ---------------- */
function renderPanel(tab, p) {
  switch (tab) {
    case 'doc':       return panelDoc(p);
    case 'dates':     return panelDates(p);
    case 'timer':     return panelTimer(p);
    case 'organizer': return panelOrganizer(p);
    case 'check':     return panelCheck(p);
    default:          return panelDoc(p);
  }
}

function noAnalysis() {
  return `<div class="bg-white rounded-xl border border-slate-200">
    ${emptyState('🤖', 'No analysis yet', 'Go to Tab 1, upload your documents and click “Analyze with AI”.')}
  </div>`;
}

/* ================= TAB 1: DOC READER & CLASSIFICATION ================= */
function fileRow(f) {
  const statusMap = {
    reading: 'text-amber-600',
    ready:   'text-emerald-600',
    error:   'text-rose-600'
  };
  const label = f.status === 'reading' ? (f.progress || 'Reading…')
              : f.status === 'error'  ? (f.progress || 'Failed')
              : (f.progress || 'Ready');

  return `<div class="flex items-center gap-3 p-3 rounded-lg border border-slate-200 bg-white">
    <div class="w-8 h-8 rounded bg-slate-100 grid place-items-center text-xs font-bold text-slate-500 shrink-0">
      ${/\.pdf$/i.test(f.name) ? 'PDF' : 'TXT'}
    </div>
    <div class="min-w-0 flex-1">
      <div class="text-sm font-medium text-slate-800 truncate">${esc(f.name)}</div>
      <div class="text-[11px] text-slate-400">
        ${fmtBytes(f.size)} · <span data-file-status="${f.id}" class="${statusMap[f.status] || 'text-slate-400'}">${esc(label)}</span>
      </div>
    </div>
    <button onclick="removeFile('${f.id}')" class="text-slate-300 hover:text-rose-600 transition text-lg leading-none px-1" title="Remove">×</button>
  </div>`;
}

function docCard(d) {
  const t = (d.type || 'Other').toUpperCase();
  return `<div class="p-3 rounded-lg border border-slate-200 bg-slate-50/60">
    <div class="flex items-center gap-2">
      <span class="text-[10px] font-bold px-2 py-0.5 rounded shrink-0 ${TYPE_COLORS[t] || TYPE_COLORS.Other}">${esc(t)}</span>
      <span class="text-sm font-medium text-slate-800 break-all">${esc(d.name || 'Untitled')}</span>
    </div>
    <p class="text-xs text-slate-600 mt-1.5 leading-relaxed">${esc(d.summary || '')}</p>
  </div>`;
}

function panelDoc(p) {
  const files = p.files || [];
  const a = p.analysis;
  const counts = {};
  ((a && a.documents) || []).forEach(d => {
    const t = (d.type || 'Other').toUpperCase();
    counts[t] = (counts[t] || 0) + 1;
  });

  return `
  <div class="grid lg:grid-cols-2 gap-5">
    <div class="bg-white rounded-xl border border-slate-200 p-5">
      <h2 class="font-semibold text-slate-800">1. Upload documents</h2>
      <p class="text-xs text-slate-500 mt-1 mb-4">PDF / TXT. Text is extracted locally in your browser — nothing leaves your device until you run the AI analysis.</p>

      <div id="dropzone" tabindex="0"
        class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center cursor-pointer hover:border-brand hover:bg-brand-light/50 transition outline-none focus:border-brand">
        <div class="text-3xl mb-2">📄</div>
        <p class="text-sm text-slate-600"><span class="text-brand font-semibold">Click to browse</span> or drag &amp; drop</p>
        <p class="text-xs text-slate-400 mt-1">Multiple files supported</p>
        <input id="fileInput" type="file" multiple accept=".pdf,.txt,application/pdf,text/plain" class="hidden">
      </div>

      <div class="mt-4 space-y-2">
        ${files.length ? files.map(fileRow).join('') : '<p class="text-sm text-slate-400 py-2">No documents uploaded yet.</p>'}
      </div>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 p-5">
      <div class="flex items-start justify-between gap-3">
        <div>
          <h2 class="font-semibold text-slate-800">2. AI classification</h2>
          <p class="text-xs text-slate-500 mt-1">Splits the bundle into Contract Docs (GCC / SCC) and VO / AI supporting documents.</p>
        </div>
        <button id="analyzeBtn" onclick="analyzeProject()" ${state.busy ? 'disabled' : ''}
          class="shrink-0 text-sm font-semibold px-4 py-2 rounded-lg transition
          ${state.busy ? 'bg-slate-300 text-white cursor-not-allowed' : 'bg-brand hover:bg-brand-dark text-white'}">
          ${state.busy ? 'Analyzing…' : 'Analyze with AI'}
        </button>
      </div>

      ${Object.keys(counts).length
        ? `<div class="flex flex-wrap gap-2 mt-4">
             ${Object.entries(counts).map(([k, v]) =>
               `<span class="text-[11px] font-semibold px-2 py-1 rounded-full ${TYPE_COLORS[k] || TYPE_COLORS.Other}">${esc(k)} · ${v}</span>`).join('')}
           </div>`
        : ''}

      <div class="mt-4 space-y-2 max-h-[520px] overflow-y-auto pr-1">
        ${a
          ? (a.documents && a.documents.length
              ? a.documents.map(docCard).join('')
              : '<p class="text-sm text-slate-400">AI returned no document classifications.</p>')
          : '<p class="text-sm text-slate-400 py-2">No analysis yet. Upload files, then click “Analyze with AI”.</p>'}
      </div>
    </div>
  </div>`;
}

/* ================= TAB 2: KEY DATES & CLAUSES ================= */
function panelDates(p) {
  const a = p.analysis;
  if (!a) return noAnalysis();

  const dates = a.key_dates || [];
  const clauses = a.key_clauses || [];

  return `<div class="grid lg:grid-cols-2 gap-5">
    <div class="bg-white rounded-xl border border-slate-200 p-5">
      <h2 class="font-semibold text-slate-800 mb-3">Key Dates</h2>
      ${dates.length ? `
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr class="text-left text-[11px] uppercase tracking-wide text-slate-500 border-b border-slate-200">
              <th class="py-2 pr-3">Date</th><th class="py-2 pr-3">Event</th><th class="py-2">Source</th>
            </tr></thead>
            <tbody>
              ${dates.map(d => `<tr class="border-b border-slate-100 last:border-0 align-top">
                <td class="py-2.5 pr-3 font-semibold text-brand whitespace-nowrap">${fmtDate(d.date)}</td>
                <td class="py-2.5 pr-3 text-slate-700">${esc(d.event || '')}</td>
                <td class="py-2.5 text-xs text-slate-500">${esc(d.source || '')}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>` : emptyState('📅', 'No key dates found', 'The AI did not detect any contractual dates.')}
    </div>

    <div class="bg-white rounded-xl border border-slate-200 p-5">
      <h2 class="font-semibold text-slate-800 mb-3">Key Clauses <span class="text-xs font-normal text-slate-500">(SCC alterations &amp; impact)</span></h2>

function sopStatus(vo, period) {
  const issued = parseDate(vo.date_issued);
  const submitted = parseDate(vo.date_submitted);

  if (!issued) {
    const ai = (vo.sop_check || '').toLowerCase();
    if (ai.includes('overdue'))   return { label: 'Overdue',   cls: 'rose',    detail: 'Per AI (issue date not found)' };
    if (ai.includes('compliant')) return { label: 'Compliant', cls: 'emerald', detail: 'Per AI (issue date not found)' };
    return { label: 'Unknown', cls: 'slate', detail: 'Date issued missing' };
  }

  const deadline = new Date(issued.getTime() + period * 86400000);
  const deadlineStr = fmtDate(deadline);

  if (!submitted) {
    const overdue = utcToday() > deadline.getTime();
    return overdue
      ? { label: 'Overdue', cls: 'rose', detail: `Deadline ${deadlineStr} already passed` }
      : { label: 'Pending', cls: 'amber', detail: `Response due ${deadlineStr}` };
  }

  const days = Math.round((submitted.getTime() - issued.getTime()) / 86400000);
  const ok = submitted.getTime() <= deadline.getTime();
  return {
    label: ok ? 'Compliant' : 'Overdue',
    cls: ok ? 'emerald' : 'rose',
    detail: `${days} day${days === 1 ? '' : 's'} after issue (limit ${period}d · deadline ${deadlineStr})`
  };
}

function updateCalc() {
  const cd = $('#calcClaimDate');
  const cp = $('#calcPeriod');
  const out = $('#calcOut');
  if (!cd || !cp || !out) return;

  const claim = parseDate(cd.value);
  const days = parseInt(cp.value, 10);

  if (!claim || !days || days <= 0) {
    out.innerHTML = '<p class="text-sm text-slate-400 mt-4">Enter a valid claim date and response period.</p>';
    return;
  }

  const deadline = new Date(claim.getTime() + days * 86400000);
  const start = claim.getTime();
  const end = deadline.getTime();
  const today = utcToday();
  const total = end - start;

  const pct = total > 0 ? Math.max(0, Math.min(100, ((today - start) / total) * 100)) : 100;
  const remaining = Math.round((end - today) / 86400000);
  const overdue = remaining < 0;
  const near = !overdue && remaining <= 5;
  const barColor = overdue ? 'bg-rose-500' : near ? 'bg-amber-500' : 'bg-emerald-500';

  out.innerHTML = `
    <div class="mt-5 rounded-xl border border-slate-200 p-4 bg-slate-50/70">
      <div class="flex flex-wrap gap-x-8 gap-y-3 text-sm">
        <div>
          <div class="text-[11px] uppercase tracking-wide text-slate-500">Payment claim date</div>
          <div class="font-semibold text-slate-800">${fmtDate(cd.value)}</div>
        </div>
        <div>
          <div class="text-[11px] uppercase tracking-wide text-slate-500">Statutory deadline (+${days}d)</div>
          <div class="font-semibold text-brand">${fmtDate(deadline.toISOString().slice(0, 10))}</div>
        </div>
        <div>
          <div class="text-[11px] uppercase tracking-wide text-slate-500">${overdue ? 'Overdue by' : 'Days remaining'}</div>
          <div class="font-semibold ${overdue ? 'text-rose-600' : near ? 'text-amber-600' : 'text-emerald-600'}">
            ${Math.abs(remaining)} day${Math.abs(remaining) === 1 ? '' : 's'}
          </div>
        </div>
      </div>

      <div class="mt-4 h-2.5 w-full bg-slate-200 rounded-full overflow-hidden">
        <div class="h-full ${barColor} rounded-full transition-all duration-500" style="width:${pct.toFixed(1)}%"></div>
      </div>
      <div class="flex justify-between text-[11px] text-slate-500 mt-1"><span>Claim</span><span>Deadline</span></div>

      <p class="text-[11px] text-slate-500 mt-3 leading-relaxed">
        Indicative calculation only. Under the Security of Payment Ordinance (Cap. 652) a payment response is generally
        due within 30 days of a payment claim, or such longer period as the contract provides. Always verify against your
        SCC and the Ordinance.
      </p>
    </div>`;
}

function bindPanel() {
  // Dropzone
  const dz = document.getElementById('dropzone');
  const fi = document.getElementById('fileInput');
  if (dz && fi) {
    dz.addEventListener('click', () => fi.click());
    dz.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fi.click(); }
    });
    ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation();
      dz.classList.add('border-brand', 'bg-brand-light');
    }));
    ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation();
      dz.classList.remove('border-brand', 'bg-brand-light');
    }));
    dz.addEventListener('drop', e => {
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });
    fi.addEventListener('change', e => {
      if (e.target.files && e.target.files.length) handleFiles(e.target.files);
    });
  }

  // SOP period
  const sp = document.getElementById('sopPeriod');
  if (sp) {
    sp.value = state.sopPeriod || 30;
    sp.addEventListener('input', updateTimerTable);
  }

  // Calculator
  const cd = document.getElementById('calcClaimDate');
  if (cd) {
    if (!cd.value) cd.value = new Date().toISOString().slice(0, 10);
    cd.addEventListener('input', updateCalc);
    const cp = document.getElementById('calcPeriod');
    if (cp) cp.addEventListener('input', updateCalc);
    updateCalc();
  }
}

/* ================= FILE HANDLING ================= */
function setFileStatus(id, text, cls) {
  const el = document.querySelector(`[data-file-status="${id}"]`);
  if (!el) return;
  el.textContent = text;
  if (cls) el.className = cls;
}

async function extractPdfText(file, onProgress) {
  if (typeof pdfjsLib === 'undefined') throw new Error('pdf.js failed to load');
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let out = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    out += content.items.map(it => it.str).join(' ') + '\n\n';
    if (onProgress) onProgress(i, pdf.numPages);
  }
  return out;
}

async function handleFiles(fileList) {
  const p = currentProject();
  if (!p) return;

  const jobs = Array.from(fileList).map(file => {
    const rec = {
      id: uid(), name: file.name, size: file.size,
      text: '', status: 'reading', progress: 'Reading…'
    };
    p.files.push(rec);
    return { file, rec };
  });

  render();

  for (const { file, rec } of jobs) {
    try {
      let text = '';
      if (/\.pdf$/i.test(file.name) || file.type === 'application/pdf') {
        text = await extractPdfText(file, (cur, total) => {
          setFileStatus(rec.id, `Page ${cur}/${total}`, 'text-amber-600');
        });
      } else {
        text = await file.text();
      }
      rec.text = (text || '').trim();
      rec.status = 'ready';
      rec.progress = rec.text.length
        ? `${rec.text.length.toLocaleString()} chars extracted`
        : 'No extractable text (scanned PDF?)';
      if (!rec.text.length) { rec.status = 'error'; rec.progress = 'No extractable text'; }
    } catch (err) {
      console.error(err);
      rec.status = 'error';
      rec.progress = err.message || 'Failed to read file';
    }
    touch(p);
    saveProjects();
    render();
  }

  toast('Documents extracted locally. Run the AI analysis when ready.', 'ok');
}

function removeFile(id) {
  const p = currentProject();
  if (!p) return;
  p.files = (p.files || []).filter(f => f.id !== id);
  touch(p);
  saveProjects();
  render();
}

/* ================= AI INTEGRATION ================= */
const SYSTEM_PROMPT = `You are "QS SMART AI", a senior Quantity Surveyor and contracts analyst specialising in Hong Kong construction contracts (HKIA / HKIS GCC and SCC) and the Security of Payment Ordinance (Cap. 652).

Analyse the supplied construction documents and return ONE raw JSON object.

ABSOLUTE OUTPUT RULES:
- Output RAW JSON ONLY. No markdown, no \`\`\`json fences, no commentary, no preamble, no explanation after.
- The response must start with { and end with }.
- Use valid JSON: double quotes only, no trailing commas, no comments.
- If a value is unknown, use an empty string "" or an empty array [].
- Dates MUST be formatted YYYY-MM-DD when known.

REQUIRED SCHEMA:
{
  "documents": [{"name": "string", "type": "GCC | SCC | VO | AI | Other", "summary": "string"}],
  "key_dates": [{"date": "YYYY-MM-DD", "event": "string", "source": "string"}],
  "key_clauses": [{"clause": "string", "source": "string", "text": "string", "impact": "string"}],
  "vo_details": [{"vo_number": "string", "amount": "string", "date_issued": "YYYY-MM-DD", "date_submitted": "YYYY-MM-DD", "status": "string", "sop_check": "Compliant | Overdue"}],
  "scc_gcc_mapping": [{"scc_ref": "string", "gcc_ref": "string", "change": "string"}]
}

CLASSIFICATION RULES:
- "GCC" = General Conditions of Contract.
- "SCC" = Special Conditions of Contract, including any Part B / amendments / appendices that modify the GCC.
- "VO" = Variation Order, variation instruction, or VO supporting documents.
- "AI" = Architect's Instructions or other AI-labelled supporting documents.
- "Other" = anything else.

ANALYSIS RULES:
- key_dates: extract every contractual milestone, deadline, commencement / completion date, VO issue date and notice-period date found in the text.
- key_clauses: focus on clauses ALTERED, ADDED or DELETED by the SCC relative to the GCC, plus any clause with cost or time impact.
- vo_details: one entry per VO found. "amount" as a string with currency (e.g. "HKD 1,250,000") or "" if not stated. "sop_check" = "Compliant" if the submission appears to fall within the Cap. 652 / SCC response period, otherwise "Overdue".
- scc_gcc_mapping: list every place where the SCC modifies the GCC. scc_ref = the SCC clause reference; gcc_ref = the GCC clause it replaces or amends.

Base every answer strictly on the supplied text. Never invent clause numbers, dates or amounts.`;

function normalizeEndpoint(url) {
  let u = (url || '').trim();
  if (!u) throw new Error('API endpoint is empty');
  u = u.replace(/\/+$/, '');
  if (/\/chat\/completions$/i.test(u)) return u;
  return u + '/chat/completions';
}

async function callAPIRaw(endpoint, apiKey, model, messages, maxTokens) {
  const url = normalizeEndpoint(endpoint);
  const headers = { 'Content-Type': 'application/json' };
  if (apiKey) headers['Authorization'] = 'Bearer ' + apiKey;

  const body = { model: model || 'deepseek-chat', messages, temperature: 0.1, stream: false };
  if (maxTokens) body.max_tokens = maxTokens;

  let res;
  try {
    res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
  } catch (e) {
    throw new Error('Network / CORS error: ' + e.message);
  }
  if (!res.ok) {
    let t = '';
    try { t = await res.text(); } catch (e) {}
    throw new Error(`HTTP ${res.status} ${res.statusText}${t ? ' — ' + t.slice(0, 200) : ''}`);
  }
  const data = await res.json();
  const content = data && data.choices && data.choices[0] && data.choices[0].message
    ? data.choices[0].message.content : null;
  if (typeof content !== 'string') throw new Error('Unexpected response shape (no choices[0].message.content)');
  return content;
}

function callAPI(messages) {
  const s = state.settings;
  if (!s.endpoint) throw new Error('API endpoint not configured. Click the gear icon to set it.');
  return callAPIRaw(s.endpoint, s.apiKey, s.model, messages, 0);
}

function parseAIJson(raw) {
  let s = String(raw || '').trim();
  s = s.replace(/```json/gi, '').replace(/```/g, '').trim();
  const a = s.indexOf('{');
  const b = s.lastIndexOf('}');
  if (a === -1 || b === -1 || b <= a) throw new Error('No JSON object found in the AI response');
  s = s.slice(a, b + 1);
  try {
    return JSON.parse(s);
  } catch (e) {
    // last-resort cleanup of common issues
    const cleaned = s.replace(/,\s*([}\]])/g, '$1');
    return JSON.parse(cleaned);
  }
}

function normalizeAnalysis(o) {
  const arr = v => Array.isArray(v) ? v : [];
  return {
    documents: arr(o.documents).map(d => ({
      name: d.name || '', type: (d.type || 'Other'), summary: d.summary || ''
    })),
    key_dates: arr(o.key_dates).map(d => ({
      date: d.date || '', event: d.event || '', source: d.source || ''
    })),
    key_clauses: arr(o.key_clauses).map(c => ({
      clause: c.clause || '', source: c.source || '', text: c.text || '', impact: c.impact || ''
    })),
    vo_details: arr(o.vo_details).map(v => ({
      vo_number: v.vo_number || '', amount: v.amount || '',
      date_issued: v.date_issued || '', date_submitted: v.date_submitted || '',
      status: v.status || '', sop_check: v.sop_check || ''
    })),
    scc_gcc_mapping: arr(o.scc_gcc_mapping).map(m => ({
      scc_ref: m.scc_ref || '', gcc_ref: m.gcc_ref || '', change: m.change || ''
    }))
  };
}

async function analyzeProject() {
  const p = currentProject();
  if (!p) return;

  const ready = (p.files || []).filter(f => f.text && f.text.trim());
  if (!ready.length) {
    toast('Upload at least one document with extractable text first.', 'warn');
    return;
  }

  // Combine text, truncated to ~40,000 characters
  const LIMIT = 40000;
  let combined = '';
  for (const f of ready) {
    const block = `\n\n===== FILE: ${f.name} =====\n${f.text}`;
    if (combined.length + block.length > LIMIT) {
      combined += block.slice(0, Math.max(0, LIMIT - combined.length));
      break;
    }
    combined += block;
  }

  state.busy = true;
  renderWorkspace();

  try {
    const raw = await callAPI([
      { role: 'system', content: SYSTEM_PROMPT },
      { role: 'user', content: `Here are the project documents:\n${combined}\n\nAnalyse them and return the JSON object only.` }
    ]);

    const json = parseAIJson(raw);
    p.analysis = normalizeAnalysis(json);
    p.analyzedAt = Date.now();
    touch(p);
    saveProjects();
    toast('Analysis complete — all tabs updated.', 'ok');
  } catch (e) {
    console.error(e);
    toast('AI analysis failed: ' + e.message, 'error');
  } finally {
    state.busy = false;
    renderWorkspace();
  }
}

/* ================= SETTINGS ================= */
function openSettings() {
  $('#setEndpoint').value = state.settings.endpoint || '';
  $('#setApiKey').value = state.settings.apiKey || '';
  $('#setModel').value = state.settings.model || 'deepseek-chat';
  const tr = $('#testResult');
  tr.textContent = '';
  tr.className = 'text-xs mb-3 min-h-[1rem]';
  $('#modalSettings').classList.remove('hidden');
}
function closeSettings() { $('#modalSettings').classList.add('hidden'); }

function saveSettings() {
  state.settings = {
    endpoint: ($('#setEndpoint').value || '').trim(),
    apiKey: ($('#setApiKey').value || '').trim(),
    model: ($('#setModel').value || '').trim() || 'deepseek-chat'
  };
  try {
    localStorage.setItem(LS_SETTINGS, JSON.stringify(state.settings));
  } catch (e) {
    toast('Could not save settings (storage full).', 'error');
    return;
  }
  closeSettings();
  toast('API settings saved.', 'ok');
}

async function testConnection() {
  const tr = $('#testResult');
  const endpoint = ($('#setEndpoint').value || '').trim();
  const apiKey = ($('#setApiKey').value || '').trim();
  const model = ($('#setModel').value || '').trim() || 'deepseek-chat';

  if (!endpoint) {
    tr.className = 'text-xs mb-3 text-rose-600';
    tr.textContent = 'Enter an endpoint URL first.';
    return;
  }

  tr.className = 'text-xs mb-3 text-slate-500';
  tr.textContent = 'Testing…';

  try {
    const text = await callAPIRaw(endpoint, apiKey, model,
      [{ role: 'user', content: 'Reply with exactly: OK' }], 16);
    tr.className = 'text-xs mb-3 text-emerald-600';
    tr.textContent = '✓ Connected. Model replied: ' + (text || '').trim().slice(0, 60);
  } catch (e) {
    tr.className = 'text-xs mb-3 text-rose-600';
    tr.textContent = '✗ ' + e.message;
  }
}

/* ================= INIT ================= */
(function init() {
  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  loadState();
  render();

  // Keyboard shortcuts for modals
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closeSettings();
      closeNewProject();
    }
    if (e.key === 'Enter') {
      if (!$('#modalNewProject').classList.contains('hidden') && document.activeElement === $('#newProjName')) {
        confirmNewProject();
      }
      if (!$('#modalSettings').classList.contains('hidden') && document.activeElement === $('#setEndpoint')) {
        saveSettings();
      }
    }
  });

  // Close modals on backdrop click
  ['modalSettings', 'modalNewProject'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('click', e => { if (e.target === el) el.classList.add('hidden'); });
  });
})();
</script>
